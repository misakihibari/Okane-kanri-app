<title>お金管理アプリ</title>
<style>
:root{
  --bg:#ffffff;
  --text:#000000;
  --text-inv:#ffffff;
  --muted:#666666;
  --line:#000000;
  --border:#d8dde3;
  --accent:#2f5496;
  --sat:#1e6fd9;
  --sun:#d93025;
  --panel:#f7f8fa;
  --radius:10px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",system-ui,sans-serif;
  font-size:14px;
  line-height:1.6;
  -webkit-text-size-adjust:100%;
}
button{font-family:inherit;font-size:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;font-size:14px;}

/* ===== Safari（iOS）対応 ここから ===== */
/* ダブルタップ拡大とタップ時の灰色ハイライトを抑制 */
html{-webkit-tap-highlight-color:rgba(0,0,0,0);}
button,label,[data-date],.tile.clickable,.tab{touch-action:manipulation;}
/* iOS Safariはbutton/aなど以外の要素のタップがdocumentまで伝わらないことがある。
   カレンダーのセル（td[data-date]）にcursor:pointerを付けて確実に反応させる */
.cal td[data-date]{cursor:pointer;}
/* iOSのSafariでボタンの角丸・影が消える現象を防ぐ */
button,input[type=submit]{-webkit-appearance:none;appearance:none;}
/* ===== Safari（iOS）対応 ここまで ===== */

/* ---------- header ---------- */
.app-header{
  display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  padding:12px 20px;border-bottom:2px solid var(--accent);
  background:var(--bg);position:sticky;top:0;z-index:50;
}
.brand{font-size:18px;font-weight:700;color:var(--accent);white-space:nowrap;}
.header-actions{margin-left:auto;}

/* ---------- 項目ごとの年・月セレクター ---------- */
.month-bar{
  display:flex;align-items:center;gap:7px;flex-wrap:wrap;
  background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
  padding:9px 13px;margin-bottom:16px;
}
.mb-label{font-size:12px;font-weight:700;color:var(--muted);margin-right:2px;}
.mb-arrow{
  width:30px;height:30px;border:1px solid var(--border);background:#fff;
  border-radius:8px;font-size:15px;line-height:1;color:var(--text);
}
.mb-arrow:hover{background:var(--accent);border-color:var(--accent);color:var(--text-inv);}
.month-bar .btn[disabled]{opacity:.45;cursor:default;}
.month-bar .btn[disabled]:hover{background:#fff;}
.mb-hint{font-size:11.5px;color:var(--muted);margin-left:4px;}
.msel{
  border:1px solid var(--border);border-radius:8px;padding:6px 6px;background:#fff;
  color:var(--text);font-weight:700;font-size:14px;cursor:pointer;
}
.msel:focus{outline:2px solid var(--accent);outline-offset:-1px;}
.header-actions{display:flex;gap:8px;}
.btn{
  border:1px solid var(--border);background:#fff;color:var(--text);
  padding:7px 14px;border-radius:8px;
}
.btn:hover{background:var(--panel);}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--text-inv);}
.btn-primary:hover{background:#25406f;}
.btn-danger{background:#fff;border-color:var(--sun);color:var(--sun);}
.btn-danger:hover{background:#fdecea;}
.btn-sm{padding:3px 9px;font-size:12px;border-radius:6px;}

/* ---------- tabs ---------- */
.tabs{
  display:flex;gap:4px;padding:0 16px;border-bottom:1px solid var(--border);
  overflow-x:auto;background:var(--bg);position:sticky;top:57px;z-index:40;
}
.tab{
  border:none;background:none;padding:11px 14px;white-space:nowrap;
  color:var(--muted);border-bottom:3px solid transparent;font-weight:600;
}
.tab:hover{color:var(--text);}
.tab.active{color:var(--accent);border-bottom-color:var(--accent);}

/* ---------- layout ---------- */
main{max-width:1120px;margin:0 auto;padding:20px 16px 80px;}
html{scroll-behavior:smooth;}

/* ---------- section (縦スクロール表示) ---------- */
.jump{
  display:flex;flex-wrap:wrap;gap:8px;align-items:center;
  font-size:12px;color:var(--muted);font-weight:600;margin-bottom:18px;
}
.jump-btn{
  border:1px solid var(--border);background:#fff;color:var(--text);
  padding:6px 13px;border-radius:999px;font-size:13px;font-weight:600;
}
.jump-btn:hover{background:var(--accent);border-color:var(--accent);color:var(--text-inv);}
.sec{scroll-margin-top:96px;}
.sec-head{
  display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;
  border-left:5px solid var(--accent);padding:2px 0 2px 12px;margin:0 0 14px;
}
.sec-head .sec-title{font-size:19px;font-weight:700;line-height:1.3;}
.sec-head .sec-desc{font-size:12px;color:var(--muted);}
.sec-head button{margin-left:auto;}
.sec-head.solo{margin-bottom:18px;}
hr.sec-div{border:none;border-top:1px dashed var(--border);margin:34px 0 26px;}
.card{
  border:1px solid var(--border);border-radius:var(--radius);
  padding:16px;margin-bottom:18px;background:#fff;
  overflow-x:auto;
}
.card h2{margin:0 0 12px;font-size:15px;font-weight:700;}
.card-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px;}
.card-head h2{margin:0;}
.card-head > .mpick,.card-head > .btn{margin-left:auto;}
.card-head > .mpick ~ .btn{margin-left:0;}
.mpick{display:flex;align-items:center;gap:4px;}
.mpick .msel{padding:4px 4px;font-size:12.5px;}
.mpick .mb-arrow{width:26px;height:26px;font-size:13px;}
.mpick .btn{padding:3px 9px;font-size:11.5px;border-radius:6px;}
.mpick .btn[disabled]{opacity:.45;cursor:default;}
.mpick .btn[disabled]:hover{background:#fff;}
.card h3{margin:18px 0 8px;font-size:13px;font-weight:700;color:var(--muted);}
.row{display:flex;gap:12px;flex-wrap:wrap;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
@media(max-width:820px){.grid2{grid-template-columns:1fr;}}
.section-title{font-size:16px;font-weight:700;margin:0 0 14px;}
.muted{color:var(--muted);font-size:12px;}
.right{text-align:right;}
.center{text-align:center;}
.spacer{flex:1;}

/* ---------- form ---------- */
.field{display:flex;flex-direction:column;gap:4px;min-width:130px;flex:1;}
.field label{font-size:12px;font-weight:600;color:var(--muted);}
.field input,.field select,.field textarea{
  padding:8px 10px;border:1px solid var(--border);border-radius:8px;
  background:#fff;color:var(--text);width:100%;
}
.field input:focus,.field select:focus{outline:2px solid var(--accent);outline-offset:-1px;}
.field.narrow{flex:0 0 130px;}
.form-actions{display:flex;gap:8px;align-items:flex-end;}

/* ---------- table ---------- */
table.list{width:100%;border-collapse:collapse;}
table.list th{
  text-align:left;font-size:12px;color:var(--muted);font-weight:700;
  padding:8px 10px;border-bottom:2px solid var(--border);white-space:nowrap;
}
table.list td{padding:8px 10px;border-bottom:1px solid #eef1f4;vertical-align:middle;}
table.list tr:last-child td{border-bottom:none;}
table.list td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;}
.color-bar{display:inline-block;width:5px;height:18px;border-radius:3px;vertical-align:-4px;margin-right:8px;}
.chip{
  display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;
}
.empty{padding:26px;text-align:center;color:var(--muted);font-size:13px;}

/* ---------- stat tiles ---------- */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;}
.tile{
  border:1px solid var(--border);border-radius:var(--radius);padding:13px 14px;background:#fff;
}
.tile .tile-label{font-size:12px;color:var(--muted);font-weight:600;}
.tile .tile-value{font-size:20px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums;}
.tile.filled .tile-label,.tile.filled .tile-value{color:inherit;}
.tile.clickable{cursor:pointer;transition:transform .08s;}
.tile.clickable:hover{transform:translateY(-2px);box-shadow:0 3px 10px rgba(0,0,0,.13);}
.tile .tile-sub{font-size:11px;opacity:.85;margin-top:3px;}
.tile .tile-note{font-size:10.5px;opacity:.9;margin-top:1px;font-weight:600;}

/* ---------- bars ---------- */
.barrow{margin-bottom:10px;}
.barrow .barhead{display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px;}
.bartrack{height:12px;background:#eef1f4;border-radius:999px;overflow:hidden;}
.barfill{height:100%;border-radius:999px;}

/* ---------- calendar ---------- */
.cal{width:100%;min-width:600px;border-collapse:collapse;table-layout:fixed;border:2px solid var(--line);}
.cal th{
  border:1px solid var(--line);padding:6px 2px;font-size:12px;font-weight:700;background:#fff;
}
.cal th.sat{color:var(--sat);}
.cal th.sun{color:var(--sun);}
.cal td{
  border:1px solid var(--line);vertical-align:top;height:96px;padding:3px;background:#fff;
}
.cal td.other{background:#fafbfc;}
.cal .daynum{font-size:12px;font-weight:700;}
.cal td.sat .daynum{color:var(--sat);}
.cal td.sun .daynum{color:var(--sun);}
.cal td.holiday .daynum{color:var(--sun);}
.cal .holname{font-size:9px;color:var(--sun);line-height:1.25;display:block;}
.cal td.today{outline:2px solid var(--accent);outline-offset:-2px;}
.shift{
  display:block;width:100%;text-align:left;border-radius:5px;padding:2px 4px;
  font-size:10px;line-height:1.3;margin-top:2px;border:1.5px solid transparent;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.shift.tentative{background:#fff !important;}
.payday{
  display:block;margin-top:3px;font-size:9.5px;border-radius:4px;padding:2px 4px;
  font-weight:700;line-height:1.3;
}
.legend{display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:12px;margin-top:10px;}
.legend .lg{display:flex;align-items:center;gap:5px;}
.legend .box{width:15px;height:15px;border-radius:4px;border:1.5px solid var(--muted);}

/* ---------- modal ---------- */
.modal-back{
  position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;
  align-items:center;justify-content:center;padding:16px;z-index:100;
}
.modal{
  background:#fff;border-radius:14px;padding:20px;width:100%;max-width:460px;
  max-height:88vh;overflow:auto;box-shadow:0 12px 40px rgba(0,0,0,.25);
  -webkit-overflow-scrolling:touch;  /* iOSの慣性スクロール */
}
/* iOSはアドレスバーの分だけvhがずれるので、対応ブラウザではdvhを使う */
@supports (max-height:80dvh){ .modal{max-height:88dvh;} }
/* ホームバー（ノッチ機種）にモーダルが隠れないように */
.modal-back{padding-bottom:calc(16px + env(safe-area-inset-bottom));}
.modal h3{margin:0 0 14px;font-size:16px;}
.modal .field{margin-bottom:12px;}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;}
.radio-group{display:flex;gap:8px;}
.radio-group label{
  flex:1;border:1px solid var(--border);border-radius:8px;padding:8px;text-align:center;
  cursor:pointer;font-size:13px;font-weight:600;color:var(--muted);
}
.radio-group input{display:none;}
.radio-group input:checked + span{color:var(--accent);}
.radio-group label:has(input:checked){border-color:var(--accent);background:#eef2f9;color:var(--accent);}
.swatches{display:grid;grid-template-columns:repeat(13,1fr);gap:4px;}
@media(max-width:520px){.swatches{grid-template-columns:repeat(9,1fr);}}
.swatches button{
  aspect-ratio:1;width:100%;border-radius:5px;border:2px solid transparent;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);
}
.swatches button:hover{transform:scale(1.15);}
.swatches button.sel{border-color:var(--text);box-shadow:0 0 0 1px #fff inset;}
.color-custom{display:flex;align-items:center;gap:8px;margin-top:8px;}
.cc-prev{width:22px;height:22px;border-radius:5px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15);}
.cc-pick{
  display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;
  color:var(--accent);cursor:pointer;border:1px solid var(--border);border-radius:8px;padding:4px 8px;
}
.cc-pick input[type=color]{width:26px;height:22px;border:none;background:none;padding:0;cursor:pointer;}
.total-line{
  display:flex;justify-content:space-between;align-items:baseline;
  border-top:2px solid var(--accent);margin-top:10px;padding-top:10px;
}
.total-line .tl-label{font-weight:700;}
.total-line .tl-value{font-size:22px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums;}
.note{background:var(--panel);border-left:3px solid var(--accent);padding:8px 12px;font-size:12px;border-radius:0 6px 6px 0;margin-bottom:12px;}
a.extlink{color:inherit;text-decoration:none;}
.pill-link{font-size:11px;opacity:.9;text-decoration:underline;}

/* ---------- スマートフォン向け調整 ---------- */
@media(max-width:600px){
  body{font-size:13.5px;}
  .app-header{padding:10px 12px;gap:10px;}
  .brand{font-size:16px;}
  .tabs{top:49px;padding:0 10px;}
  main{padding:14px 10px 70px;}
  .card{padding:12px;}
  .sec-head .sec-title{font-size:17px;}
  .tiles{grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;}
  .tile{padding:10px 11px;}
  .tile .tile-value{font-size:17px;}
  .field{min-width:100%;}
  .field.narrow{flex:1 1 100%;}
  .form-actions{width:100%;}
  .form-actions .btn{flex:1;}
  .modal{padding:16px;}
  .row{gap:10px;}

  /* カレンダーは横スクロールさせず画面幅に収める */
  .cal{min-width:0;table-layout:fixed;}
  .cal th{padding:3px 1px;font-size:9.5px;}
  .cal td{height:58px;padding:2px 1px;}
  .cal .daynum{font-size:10px;}
  .cal .holname{font-size:6.5px;line-height:1.1;}

<div id="modalRoot"></div>

<script>
"use strict";

/* ============================================================
   0. ユーティリティ
   ============================================================ */
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.prototype.slice.call(r.querySelectorAll(s));
const yen = n => '¥' + Math.round(n || 0).toLocaleString('ja-JP');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad2 = n => String(n).padStart(2, '0');
const ymd  = d => d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
const ym   = d => d.getFullYear() + '-' + pad2(d.getMonth() + 1);

/** 背景色に対して読みやすい文字色（黒 or 白）を返す */
function textOn(hex) {
  const h = hex.replace('#', '');
  const r = parseInt(h.slice(0, 2), 16), g = parseInt(h.slice(2, 4), 16), b = parseInt(h.slice(4, 6), 16);
  const lum = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
  return lum > 0.62 ? '#000000' : '#ffffff';
}

/* 色パレット：12系統 × 4トーン ＋ グレー系（計52色）。さらに任意の色も選択可 */
const PALETTE = [
  '#FFB3B0','#F2726A','#E8564B','#B3382F',   // 赤
  '#FFD1A6','#F7A35C','#F2994A','#C9741F',   // オレンジ
  '#FFE9A8','#F7D154','#F2C94C','#C9A227',   // 黄
  '#DDF0A8','#BFDE6B','#A3C93A','#7A9628',   // 黄緑
  '#B8ECC8','#6FCF97','#27AE60','#1B7F46',   // 緑
  '#A8E6E1','#4DC9BE','#00A99D','#007A72',   // ティール
  '#ADE4F7','#71CFEF','#56CCF2','#2196C4',   // 水色
  '#AECBF5','#6FA8E8','#2D9CDB','#1E6FD9',   // 青
  '#A9B6E8','#6E80CC','#4056A1','#2F5496',   // 藍
  '#D3B8F0','#B07EE0','#9B51E0','#6C2DB0',   // 紫
  '#F6BEDC','#EE8FBE','#EB5FA0','#C03C7A',   // ピンク
  '#D9C4B0','#B08968','#8D6E63','#5D4037',   // ブラウン
  '#C7CDD3','#8A949E','#5A6570','#2B3138'    // グレー
];
/* 自動割当は色相が離れた順に選ぶ */
const AUTO_ORDER = ['#E8564B','#2D9CDB','#27AE60','#F2994A','#9B51E0','#00A99D','#EB5FA0','#F2C94C',
                    '#2F5496','#A3C93A','#8D6E63','#56CCF2','#6C2DB0','#C9741F','#1B7F46','#C03C7A',
                    '#4056A1','#4DC9BE','#B3382F','#5A6570'];

function nextColor(used) {
  const lower = used.map(c => String(c).toLowerCase());
  const free = AUTO_ORDER.concat(PALETTE).filter(c => lower.indexOf(c.toLowerCase()) === -1);
  return free.length ? free[0] : PALETTE[used.length % PALETTE.length];
}

/* ============================================================
   1. データ層（localStorage / メモリフォールバック）
   ============================================================ */
const STORAGE_KEY = 'money-manager-v1';
let memoryOnly = false;

function defaultState() {
  return {
    seq: 100,
    genres: [
      { id: 1, name: '食費',            color: '#E8564B', sort: 0 },
      { id: 2, name: '推し活',          color: '#EB5FA0', sort: 1 },
      { id: 3, name: 'ファッション・美容', color: '#9B51E0', sort: 2 },
      { id: 4, name: '交通費',          color: '#2D9CDB', sort: 3 },
      { id: 5, name: '部活関係',        color: '#27AE60', sort: 4 }
    ],
    paymentMethods: [
      { id: 10, type: 'cash', name: '現金', url: '', color: '#6FCF97' }
    ],
    expenses: [],
    bankAccounts: [],
    bankTx: [],
    workplaces: [],
    shifts: [],
    budgets: [],
    monthlyBudget: {},
    savingsGoals: [],
    savings: [],
    recurring: []
  };
}

/* Safariはfile://で開いた場合やプライベートブラウズで保存が使えないことがある。
   起動時に実際に書き込みを試して判定する */
function storageUsable() {
  try {
    const k = '__test__' + Date.now();
    localStorage.setItem(k, '1');
    localStorage.removeItem(k);
    return true;
  } catch (e) { return false; }
}

let state = loadState();

function loadState() {
  if (!storageUsable()) memoryOnly = true;   /* 保存はできないが、読み出しは試みる */
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      const base = defaultState();
      Object.keys(base).forEach(k => { if (parsed[k] === undefined) parsed[k] = base[k]; });
      return parsed;
    }
  } catch (e) { memoryOnly = true; }
  return defaultState();
}

function save() {
  if (memoryOnly) return;
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
  catch (e) { memoryOnly = true; }
}

const uid = () => ++state.seq;

function commit() { save(); render(true); }

/* 参照ヘルパー */
const genreById = id => state.genres.find(g => g.id === id) || { name: '(未分類)', color: '#cccccc' };
const pmById    = id => state.paymentMethods.find(p => p.id === id) || { name: '(不明)', color: '#cccccc', type: 'cash', url: '' };
const wpById    = id => state.workplaces.find(w => w.id === id) || { name: '(不明)', color: '#cccccc', wage: 0, payday: 25, transport: 0 };

/** その月のクレジット・デビット・現金の予算を取り出す（未設定は0） */
function monthBudget(mm) {
  const b = (state.monthlyBudget || {})[mm] || {};
  return {
    card:  Number(b.card)  || 0,
    debit: Number(b.debit) || 0,
    cash:  Number(b.cash)  || 0
  };
}
function setMonthBudget(mm, card, debit, cash) {
  if (!state.monthlyBudget) state.monthlyBudget = {};
  state.monthlyBudget[mm] = { card: card, debit: debit, cash: cash };
}
/** 支払方法の種別（'card' / 'debit' / 'cash'）を返す */
function payKindOf(pmId) {
  const t = pmById(pmId).type;
  return t === 'card' ? 'card' : t === 'debit' ? 'debit' : 'cash';
}
const acById    = id => state.bankAccounts.find(a => a.id === id) || { bankName: '(不明)', color: '#cccccc', initialBalance: 0 };

/* ============================================================
   2. 日本の祝日判定
   ============================================================ */
const holidayCache = {};
function jpHolidays(year) {
  if (holidayCache[year]) return holidayCache[year];
  const map = {};
  const set = (m, d, name) => { map[m + '-' + d] = name; };
  const nthMonday = (m, n) => {
    const w = new Date(year, m - 1, 1).getDay();
    return 1 + ((1 - w + 7) % 7) + (n - 1) * 7;
  };
  set(1, 1, '元日');
  set(1, nthMonday(1, 2), '成人の日');
  set(2, 11, '建国記念の日');
  set(2, 23, '天皇誕生日');
  set(3, Math.floor(20.8431 + 0.242194 * (year - 1980) - Math.floor((year - 1980) / 4)), '春分の日');
  set(4, 29, '昭和の日');
  set(5, 3, '憲法記念日');
  set(5, 4, 'みどりの日');
  set(5, 5, 'こどもの日');
  set(7, nthMonday(7, 3), '海の日');
  set(8, 11, '山の日');
  set(9, nthMonday(9, 3), '敬老の日');
  set(9, Math.floor(23.2488 + 0.242194 * (year - 1980) - Math.floor((year - 1980) / 4)), '秋分の日');
  set(10, nthMonday(10, 2), 'スポーツの日');
  set(11, 3, '文化の日');
  set(11, 23, '勤労感謝の日');

  const key = dt => (dt.getMonth() + 1) + '-' + dt.getDate();
  // 国民の休日（前後が祝日で自身が祝日でない平日）
  for (let m = 1; m <= 12; m++) {
    const last = new Date(year, m, 0).getDate();
    for (let d = 1; d <= last; d++) {
      const cur = new Date(year, m - 1, d);
      if (map[key(cur)] || cur.getDay() === 0) continue;
      const prev = new Date(year, m - 1, d - 1), next = new Date(year, m - 1, d + 1);
      if (map[key(prev)] && map[key(next)]) map[key(cur)] = '国民の休日';
    }
  }
  // 振替休日（日曜が祝日 → 次の非祝日）
  const substitutes = {};
  for (let m = 1; m <= 12; m++) {
    const last = new Date(year, m, 0).getDate();
    for (let d = 1; d <= last; d++) {
      const cur = new Date(year, m - 1, d);
      if (!map[key(cur)] || cur.getDay() !== 0) continue;
      let nx = new Date(year, m - 1, d + 1);
      while (map[key(nx)] || substitutes[key(nx)]) nx = new Date(nx.getFullYear(), nx.getMonth(), nx.getDate() + 1);
      if (nx.getFullYear() === year) substitutes[key(nx)] = '振替休日';
    }
  }
  Object.assign(map, substitutes);
  holidayCache[year] = map;
  return map;
}
function holidayName(date) {
  return jpHolidays(date.getFullYear())[(date.getMonth() + 1) + '-' + date.getDate()] || null;
}

/** 「25」→「25日」、「end」→「月末」 */
function dayLabel(v) { return v === 'end' ? '月末' : (v == null ? '—' : v + '日'); }

/** 給料日の表示文（「翌月25日」「当月末」「翌月末」） */
function paydayText(v) {
  if (v === 'next-end') return '翌月末';
  if (v === 'end') return '当月末';
  return v == null ? '—' : '翌月' + v + '日';
}
/** 給料日が締め月の翌月になる設定かどうか（「当月末」だけが締め月と同じ月） */
function isNextMonthPayday(wp) { return wp.payday !== 'end'; }

/** 1〜31日＋月末 の選択肢 */
function dayOpts31() {
  const o = [];
  for (let i = 1; i <= 31; i++) o.push({ value: String(i), label: i + '日' });
  o.push({ value: 'end', label: '月末' });
  return o;
}
/** 給料日用の選択肢。「当月末」以外はすべて締め月の翌月に支給される */
function paydayOpts() {
  const o = [];
  for (let i = 1; i <= 31; i++) o.push({ value: String(i), label: '翌月' + i + '日' });
  o.push({ value: 'end', label: '当月末' });
  o.push({ value: 'next-end', label: '翌月末' });
  return o;
}

/** その月の給料に対応する勤務期間を、勤務先の締め日で区切って返す */
function payPeriod(wp, month) {
  const [y, m] = month.split('-').map(Number);
  const cut = wp.cutoff;
  if (cut == null || cut === 'end') {
    return { from: ymd(new Date(y, m - 1, 1)), to: ymd(new Date(y, m, 0)) };
  }
  const c = Number(cut) || 31;
  const prevLast = new Date(y, m - 1, 0).getDate();
  const curLast  = new Date(y, m, 0).getDate();
  return {
    from: ymd(new Date(y, m - 2, Math.min(c, prevLast) + 1)),
    to:   ymd(new Date(y, m - 1, Math.min(c, curLast)))
  };
}

/** クレジットカードの引き落とし日が休日（土日祝）のとき、次の平日にずらすかどうかの設定を反映して
 *  実際の引き落とし日を返す */
function actualWithdrawalDate(pm, year, month) {
  const lastDay = new Date(year, month, 0).getDate();
  let d = new Date(year, month - 1, Math.min(pm.withdrawalDay || 27, lastDay));
  if (pm.withdrawalShift) {
    let guard = 0;
    while ((d.getDay() === 0 || d.getDay() === 6 || holidayName(d)) && guard++ < 20) {
      d = new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1);
    }
  }
  return d;
}

/** その月の実際の給料日を返す。
 *  勤務先の設定が「前倒し」なら、給料日が土日祝のとき直前の平日まで戻す */
function actualPayday(wp, year, month) {
  let y = year, m = month;
  /* 「当月末」以外は、締めた月の翌月に支給される */
  if (wp.payday !== 'end') { m += 1; if (m > 12) { m = 1; y += 1; } }
  const lastDay = new Date(y, m, 0).getDate();
  const dayNum = (wp.payday === 'end' || wp.payday === 'next-end')
    ? lastDay : Math.min(Number(wp.payday) || 25, lastDay);
  let d = new Date(y, m - 1, dayNum);
  if (wp.paydayShift) {
    let guard = 0;
    while ((d.getDay() === 0 || d.getDay() === 6 || holidayName(d)) && guard++ < 20) {
      d = new Date(d.getFullYear(), d.getMonth(), d.getDate() - 1);
    }
  }
  return d;
}

/* ============================================================
   3. 集計ロジック
   ============================================================ */
const inMonth = (dateStr, month) => typeof dateStr === 'string' && dateStr.slice(0, 7) === month;

/** 'YYYY-MM' の1ヶ月後 */
function nextMonthOf(month) {
  const [y, m] = month.split('-').map(Number);
  return ym(new Date(y, m, 1));
}

/** その月に有効な繰り返し出費 */
function activeRecurring(month) {
  return (state.recurring || []).filter(r =>
    r.startMonth && r.startMonth <= month && (!r.endMonth || month <= r.endMonth));
}

/** 繰り返し出費を、その月の1日付けの出費として展開する（自動記録） */
function recurringExpensesOf(month) {
  return activeRecurring(month).map(r => ({
    id: 'r' + r.id + '@' + month,
    recurringId: r.id,
    auto: true,
    date: month + '-01',
    item: r.item,
    amount: r.amount,
    genreId: r.genreId,
    pmId: r.pmId,
    memo: r.memo || ''
  }));
}

/** 指定した支払方法の繰り返し出費を、untilDate（既定は今日）まで積み上げた合計 */
function recurringSumUntil(pmIds, untilDate) {
  const limit = untilDate || ymd(new Date());
  let total = 0;
  (state.recurring || []).forEach(r => {
    if (!r.startMonth || pmIds.indexOf(r.pmId) === -1) return;
    let m = r.startMonth, guard = 0;
    while (guard++ < 600) {
      if (r.endMonth && m > r.endMonth) break;
      if ((m + '-01') > limit) break;
      total += r.amount;
      m = nextMonthOf(m);
    }
  });
  return total;
}

const sortKeyOf = x => (typeof x.id === 'number' ? x.id : -1);

function monthExpenses(month) {
  return recurringExpensesOf(month)
    .concat(state.expenses.filter(e => inMonth(e.date, month)))
    .sort((a, b) => a.date < b.date ? 1 : a.date > b.date ? -1 : sortKeyOf(b) - sortKeyOf(a));
}
function sumBy(list, keyFn, valFn) {
  const m = new Map();
  list.forEach(x => { const k = keyFn(x); m.set(k, (m.get(k) || 0) + valFn(x)); });
  return m;
}
/** 勤務時間（時間, 休憩控除後） */
function shiftHours(s) {
  const [sh, sm] = String(s.start).split(':').map(Number);
  const [eh, em] = String(s.end).split(':').map(Number);
  let mins = (eh * 60 + em) - (sh * 60 + sm);
  if (mins < 0) mins += 24 * 60;           // 日跨ぎ勤務
  mins -= (s.breakMin || 0);
  return Math.max(0, mins) / 60;
}
/** 勤務先ごとの月間集計（確定分 / 確定+仮） */
function payrollOfMonth(month) {
  const res = state.workplaces.map(w => {
    const per = payPeriod(w, month);
    const list = state.shifts.filter(s => s.workplaceId === w.id && s.date >= per.from && s.date <= per.to);
    const conf = list.filter(s => s.status === 'confirmed');
    const hoursConf = conf.reduce((a, s) => a + shiftHours(s), 0);
    const hoursAll  = list.reduce((a, s) => a + shiftHours(s), 0);
    const daysConf  = new Set(conf.map(s => s.date)).size;
    const daysAll   = new Set(list.map(s => s.date)).size;
    return {
      wp: w, period: per,
      hoursConf, hoursAll,
      wageConf: Math.round(hoursConf * w.wage),
      wageAll:  Math.round(hoursAll  * w.wage),
      transConf: daysConf * (w.transport || 0),
      transAll:  daysAll  * (w.transport || 0),
      daysConf, daysAll
    };
  });
  return res;
}
/** その月に「振り込まれる」給与を勤務先ごとに集計する。
 *  給料日が翌月の勤務先は、前月に働いた分がこの月の給与になる */
function payrollPaidIn(month) {
  const prevM = prevMonthOf(month);
  const cur = payrollOfMonth(month);
  const prv = payrollOfMonth(prevM);
  return state.workplaces.map(w => {
    const next = isNextMonthPayday(w);
    const src = next ? prevM : month;
    const r = (next ? prv : cur).find(x => x.wp.id === w.id);
    return Object.assign({}, r, { srcMonth: src });
  });
}

/** その口座を引き落とし先にしているデビットカードでの出費合計 */
function debitOutOf(accountId, untilDate) {
  const ids = state.paymentMethods
    .filter(p => p.type === 'debit' && p.accountId === accountId)
    .map(p => p.id);
  if (!ids.length) return 0;
  return state.expenses
    .filter(e => ids.indexOf(e.pmId) !== -1 && (!untilDate || e.date <= untilDate))
    .reduce((a, e) => a + e.amount, 0)
    + recurringSumUntil(ids, untilDate);
}

/** その口座に貯金した合計 */
function savingsInOf(accountId, untilDate) {
  return (state.savings || [])
    .filter(v => v.accountId === accountId && (!untilDate || v.date <= untilDate))
    .reduce((a, v) => a + v.amount, 0);
}

/** 口座残高（指定日まで／全期間）。デビットカードの利用分を引き、貯金分を足す */
function balanceOf(accountId, untilDate) {
  const ac = acById(accountId);
  const byTx = state.bankTx
    .filter(t => t.accountId === accountId && (!untilDate || t.date <= untilDate))
    .reduce((a, t) => a + (t.type === 'in' ? t.amount : -t.amount), ac.initialBalance || 0);
  return byTx - debitOutOf(accountId, untilDate) + savingsInOf(accountId, untilDate);
}

/* ---------- 貯金 ---------- */

/** 目標の期限を文にする（年だけ／月だけ／両方／未設定） */
function goalDeadline(g) {
  const y = g.targetYear, m = g.targetMonth;
  if (y && m) return y + '年' + m + '月までに';
  if (y) return y + '年までに';
  if (m) return m + '月までに';
  return '期限なし';
}
/** その目標にこれまで貯金した合計 */
function savedFor(goalId) {
  return (state.savings || []).filter(v => v.goalId === goalId).reduce((a, v) => a + v.amount, 0);
}

  Object.keys(monthOf).forEach(k => ys.add(Number(monthOf[k].slice(0, 4))));
  ys.add(payrollYear);

}

      if (!b) return;
      const key = box.dataset.colorFor;
      $$('button', box).forEach(x => x.classList.remove('sel'));
      b.classList.add('sel');
      syncColor(key, b.dataset.c);
    });
  });
  $$('#modalRoot input[data-custom-for]').forEach(inp => {
    inp.addEventListener('input', () => {
      const key = inp.getAttribute('data-custom-for');
      const box = $('.swatches[data-color-for="' + key + '"]');
      if (box) $$('button', box).forEach(x => x.classList.remove('sel'));
      syncColor(key, inp.value);
    });
  });
  $('#mCancel').onclick = closeModal;
  $('.modal-back').addEventListener('mousedown', ev => { if (ev.target.classList.contains('modal-back')) closeModal(); });
  if (onDelete) $('#mDel').onclick = () => { if (confirm('この項目を削除します。よろしいですか？')) { closeModal(); onDelete(); } };

  $('#modalForm').addEventListener('submit', ev => {
    ev.preventDefault();
    const fd = new FormData(ev.target);
    const data = {};
    fields.forEach(f => {
      if (f.type === 'color') data[f.key] = colorState[f.key];
      else if (f.type === 'time10') data[f.key] = (fd.get(f.key + '__h') || '00') + ':' + (fd.get(f.key + '__m') || '00');
      else if (f.type === 'ym') {
        const yy = fd.get(f.key + '__y'), mm = fd.get(f.key + '__m');
        data[f.key] = (yy && mm) ? yy + '-' + pad2(Number(mm)) : null;
      }
      else if (f.type === 'number') data[f.key] = Number(fd.get(f.key) || 0);
      else data[f.key] = fd.get(f.key);
    });
    closeModal();
    onSubmit(data);
  });
  if (onRender) onRender($('#modalForm'));
  const first = $('#modalForm input, #modalForm select');
  if (first) first.focus();
}

function editPayment(p) {
  const isCash = p && p.type === 'cash';
  formModal({
    title: p ? '支払方法を編集' : 'カードを追加',
    fields: [
      ...(isCash ? [] : [{ key: 'cardType', label: 'カードの種類', type: 'select',
        value: p && p.type === 'debit' ? 'debit' : 'card',
        options: [{ value: 'card', label: 'クレジットカード' }, { value: 'debit', label: 'デビットカード' }],
        hint: 'デビットカードは支払予定額（引き落とし）の合計には含めません' }]),
      { key: 'name',  label: isCash ? '名称' : 'カード会社名', type: 'text', value: p ? p.name : '', required: true, placeholder: '例：〇〇カード' },
      ...(isCash ? [] : [{ key: 'withdrawalDay', label: '引き落とし日（毎月◯日）', type: 'number',
        value: p && p.withdrawalDay ? p.withdrawalDay : 27, min: 1, max: 31,
        hint: 'クレジットカードのみ使います。利用分は翌月のこの日に引き落とされます' }]),
      ...(isCash ? [] : [{ key: 'withdrawalShift', label: '引き落とし日が土日祝のとき', type: 'select',
        value: (p && p.withdrawalShift) ? '1' : '0',
        options: [{ value: '0', label: 'そのままにする' }, { value: '1', label: '次の平日にずらす' }],
        hint: '例：27日が土曜なら、29日（月）に引き落とされます' }]),
      ...(isCash ? [] : [{ key: 'accountId', label: '引き落とし先の銀行口座', type: 'select',
        value: String(p && p.accountId ? p.accountId : ''),
        options: [{ value: '', label: state.bankAccounts.length ? '（設定しない）' : '（口座が未登録です）' }]
          .concat(state.bankAccounts.map(a => ({ value: String(a.id), label: a.bankName }))),
        hint: 'デビットカードのみ使います。出費を記録すると、この口座の残高から自動で引かれます' }]),
      { key: 'color', label: '表示色', type: 'color', value: p ? p.color : nextColor(state.paymentMethods.map(x => x.color)) }
    ],
    /* デビットを選んだときは「引き落とし日」の欄を隠す */
    onRender: isCash ? null : form => {
      const sel = form.querySelector('[name="cardType"]');
      const wd  = form.querySelector('[name="withdrawalDay"]');
      const ws  = form.querySelector('[name="withdrawalShift"]');
      const ac  = form.querySelector('[name="accountId"]');
      if (!sel || !wd || !ac) return;
      const wdBox = wd.closest('.field'), acBox = ac.closest('.field');
      const wsBox = ws ? ws.closest('.field') : null;
      /* クレジットなら引き落とし日まわり、デビットなら引き落とし先口座だけを見せる */
      const sync = () => {
        const debit = sel.value === 'debit';
        wdBox.style.display = debit ? 'none' : '';
        if (wsBox) wsBox.style.display = debit ? 'none' : '';
        acBox.style.display = debit ? '' : 'none';
      };
      sel.addEventListener('change', sync);
      sync();
    },
    onSubmit: d => {
      const t = isCash ? 'cash' : (d.cardType === 'debit' ? 'debit' : 'card');
      const wd = t === 'debit' ? null : (d.withdrawalDay || null);
      const wshift = t === 'debit' ? false : d.withdrawalShift === '1';
      const ai = t === 'debit' ? (Number(d.accountId) || null) : null;
      if (p) {
        p.name = d.name; p.color = d.color;
        if (!isCash) { p.type = t; p.withdrawalDay = wd; p.withdrawalShift = wshift; p.accountId = ai; }
      }
      else state.paymentMethods.push({ id: uid(), type: t, name: d.name, url: '', color: d.color, withdrawalDay: wd, withdrawalShift: wshift, accountId: ai });
      commit();
    },
    onDelete: (p && !isCash) ? () => {
      if (state.expenses.some(e => e.pmId === p.id) || (state.recurring || []).some(r => r.pmId === p.id)) {
        alert('この支払方法を使用している出費記録があるため削除できません。'); return; }
      state.paymentMethods = state.paymentMethods.filter(x => x.id !== p.id); commit();
    } : null
  });
}

      { key: 'title', label: 'タイトル', type: 'text', value: g ? g.title : '', required: true,
        placeholder: '例：旅行の資金' },
      { key: 'targetAmount', label: '目標金額（円）', type: 'number', value: g ? g.targetAmount : 0,
        min: 0, step: '1', required: true },

        value: String(g && g.targetYear ? g.targetYear : ''), options: yearOptions },

        value: String(g && g.targetMonth ? g.targetMonth : ''), options: monthOptions,
        hint: '年だけ・月だけの指定でもかまいません' },
      { key: 'accountId', label: '貯金先の銀行口座', type: 'select',
        value: String(g && g.accountId ? g.accountId : ''),
        options: [{ value: '', label: state.bankAccounts.length ? '（選択してください）' : '（口座が未登録です）' }]
          .concat(state.bankAccounts.map(a => ({ value: String(a.id), label: a.bankName }))),
        hint: '貯金を記録すると、この口座の預金残高が増えます' },
      { key: 'color', label: '表示色', type: 'color',
        value: g ? g.color : nextColor((state.savingsGoals || []).map(x => x.color)) }
    ],
    onSubmit: d => {
      if (!d.accountId) { alert('貯金先の銀行口座を選んでください。'); return; }

        title: d.title,
        targetAmount: Number(d.targetAmount) || 0,
        targetYear:  d.targetYear  ? Number(d.targetYear)  : null,
        targetMonth: d.targetMonth ? Number(d.targetMonth) : null,

      };

        state.savingsGoals.push(Object.assign({ id: uid() }, data));

    } : null,
    deleteLabel: '目標ごと削除'
  });
}

/* ============================================================
   ビュー⓪ 貯金
   ============================================================ */
function viewSavings() {
  const goals = state.savingsGoals || [];

  if (!state.bankAccounts.length) {
    return '<div class="card"><h2>貯金</h2>' +
      emptyBox('先に「銀行口座」で貯金先の口座を登録してください。') +
      '<div class="center"><button class="btn btn-primary" data-add-ac>＋ 銀行口座を追加</button></div></div>';
  }
  if (!goals.length) {
    return '<div class="card"><h2>貯金の目標</h2>' +
      emptyBox('目標がまだ登録されていません。') +
      '<div class="center"><button class="btn btn-primary" data-add-goal>＋ 目標を追加</button></div></div>';
  }

  /* 目標ごとの進み具合 */
  const cards = goals.map(g => {
    const saved = savedFor(g.id);
    const rest  = Math.max(0, g.targetAmount - saved);
    const done  = saved >= g.targetAmount && g.targetAmount > 0;
    const pct   = g.targetAmount > 0 ? Math.min(100, Math.round(saved / g.targetAmount * 100)) : 0;
    const ac    = acById(g.accountId);
    return '<div class="bud-row">' +
      '<div class="bud-head">' +
      '<span class="bud-name"><span class="color-bar" style="background:' + g.color + '"></span>' + esc(g.title) + '</span>' +
      '<span class="bud-rest">' + (done
        ? '<strong style="color:#1e7e34">目標達成</strong>'
        : 'あと <strong style="color:var(--accent)">' + yen(rest) + '</strong>') + '</span></div>' +
      '<div class="bud-bar"><span style="width:' + pct + '%;background:' + (done ? '#1e7e34' : g.color) + '"></span></div>' +
      '<div class="bud-sub muted">' + esc(goalDeadline(g)) + '　目標 ' + yen(g.targetAmount) +
        '　貯金済み ' + yen(saved) + '（' + pct + '%）　貯金先 ' + esc(ac.bankName) +
        '　<button class="btn btn-sm" data-edit-goal="' + g.id + '">編集</button></div>' +
      '</div>';
  }).join('');

  const goalCard = '<div class="card"><h2>貯金の目標</h2>' + cards +
    '<div class="row" style="margin-top:12px"><button class="btn btn-sm btn-primary" data-add-goal>＋ 目標を追加</button></div></div>';

  /* 貯金の記録フォーム */
  const goalOptions = goals.map(g => '<option value="' + g.id + '">' + esc(g.title) + '</option>').join('');
  const form = '<div class="card card-form"><h2>貯金を記録する</h2><form id="savForm"><div class="row">' +
    '<div class="field"><label>どの目標に貯金しますか</label><select name="goalId">' + goalOptions + '</select></div>' +
    '<div class="field"><label>日付</label><input type="date" name="date" value="' + ymd(new Date()) + '" required></div>' +
    '<div class="field"><label>金額（円）</label><input type="number" name="amount" min="0" step="1" required></div>' +
    '<div class="field"><label>メモ（任意）</label><input type="text" name="memo" placeholder="例：今月分"></div>' +
    '<div class="form-actions"><button type="submit" class="btn btn-primary">記録する</button></div>' +
    '</div></form>' +
    '<div class="muted" style="margin-top:10px">記録すると、その目標の貯金先に設定した口座の預金残高が増えます。</div></div>';

  /* 貯金の履歴 */
  const list = (state.savings || []).slice().sort((a, b) => a.date < b.date ? 1 : a.date > b.date ? -1 : b.id - a.id);
  const rows = list.map(v => {
    const g = goals.find(x => x.id === v.goalId) || { title: '(削除済み)', color: '#cccccc' };
    return '<tr><td class="muted">' + v.date.slice(5).replace('-', '/') + '</td>' +
      '<td><span class="color-bar" style="background:' + g.color + '"></span>' + esc(g.title) + '</td>' +
      '<td class="muted">' + esc(acById(v.accountId).bankName) + '</td>' +
      '<td class="muted">' + esc(v.memo || '') + '</td>' +
      '<td class="num" style="color:#1e7e34"><strong>+' + yen(v.amount) + '</strong></td>' +
      '<td class="num"><button class="btn btn-sm btn-danger" data-del-sav="' + v.id + '">削除</button></td></tr>';
  }).join('');

  const totalSaved = list.reduce((a, v) => a + v.amount, 0);
  const historyCard = '<div class="card"><h2>貯金の記録（' + list.length + '件）</h2>' +
    (list.length
      ? '<table class="list list-tx"><thead><tr><th>日付</th><th>目標</th><th>貯金先</th><th>メモ</th><th class="right">金額</th><th></th></tr></thead><tbody>' +
        rows + '</tbody></table>' + totalLine('貯金の合計', totalSaved)
      : emptyBox('貯金の記録はまだありません。')) + '</div>';

  return goalCard + form + historyCard;
}

function bindSavings() {
  const f = $('#savForm');
  if (!f) return;
  f.addEventListener('submit', ev => {
    ev.preventDefault();
    const fd = new FormData(f);
    const goalId = Number(fd.get('goalId'));
    const goal = (state.savingsGoals || []).find(g => g.id === goalId);
    if (!goal) { alert('目標を選んでください。'); return; }
    const amount = Number(fd.get('amount') || 0);
    if (amount <= 0) { alert('金額を入力してください。'); return; }
    if (!state.savings) state.savings = [];
    state.savings.push({
      id: uid(), goalId: goalId, accountId: goal.accountId,
      date: fd.get('date'), amount: amount, memo: fd.get('memo') || ''
    });
    commit();
  });
}

/** カレンダーの1日を大きく表示する。シフトをタップで編集、空欄をタップで追加 */
function dayModal(ds) {
  const [yy, mm, dd] = ds.split('-').map(Number);
  const date = new Date(yy, mm - 1, dd);
  const dows = ['日', '月', '火', '水', '木', '金', '土'];
  const hol = holidayName(date);
  const list = state.shifts.filter(s => s.date === ds).sort((a, b) => a.start < b.start ? -1 : 1);

  const payOf = s => Math.round(shiftHours(s) * (wpById(s.workplaceId).wage || 0));
  const items = list.map(s => {
    const w = wpById(s.workplaceId);
    const conf = s.status === 'confirmed';
    const style = conf
      ? 'background:' + w.color + ';color:' + textOn(w.color) + ';border-color:' + w.color
      : 'background:#fff;border-color:' + w.color + ';color:' + w.color;
    return '<button type="button" class="day-shift" data-dshift="' + s.id + '" style="' + style + '">' +
      '<span class="ds-top"><span class="ds-time">' + esc(s.start) + ' 〜 ' + esc(s.end) + '</span>' +
      '<span class="ds-pay">' + yen(payOf(s)) + '</span></span>' +
      '<span class="ds-name">' + esc(w.name) + '</span>' +
      '<span class="ds-sub">実働 ' + shiftHours(s).toFixed(1) + 'h' +
      (s.breakMin ? '（休憩' + s.breakMin + '分）' : '') + ' ／ ' + (conf ? '確定' : '仮') + '</span>' +
      '</button>';
  }).join('');

  /* その日に稼いだ金額のまとめ */
  const payAll  = list.reduce((a, s) => a + payOf(s), 0);
  const payConf = list.filter(s => s.status === 'confirmed').reduce((a, s) => a + payOf(s), 0);
  const trans   = Array.from(new Set(list.map(s => s.workplaceId)))
    .reduce((a, id) => a + (wpById(id).transport || 0), 0);
  const hasTent = list.some(s => s.status !== 'confirmed');
  const sumLine = list.length
    ? '<div class="day-sum">' +
      '<div class="dsum-main"><span>この日の給与</span><strong>' + yen(payAll) + '</strong></div>' +
      '<div class="dsum-sub muted">' +
      (hasTent ? '確定分のみ ' + yen(payConf) + '　' : '') +
      (trans ? '交通費 ' + yen(trans) + '　' : '') +
      '合計 ' + yen(payAll + trans) + '</div></div>'
    : '';

  const dowCls = date.getDay() === 0 || hol ? 'sun' : date.getDay() === 6 ? 'sat' : '';
  $('#modalRoot').innerHTML =
    '<div class="modal-back"><div class="modal">' +
    '<h3 class="' + dowCls + '">' + mm + '月' + dd + '日（' + dows[date.getDay()] + '）' +
      (hol ? '<span class="muted" style="font-weight:400"> ' + esc(hol) + '</span>' : '') + '</h3>' +
    sumLine +
    '<div class="day-list">' + items +
    '<button type="button" class="day-empty" data-dadd="1">＋ この日にシフトを追加</button>' +
    '</div>' +
    '<div class="modal-actions"><button type="button" class="btn" id="mCancel">閉じる</button></div>' +
    '</div></div>';

  $('#mCancel').onclick = closeModal;
  $('.modal-back').addEventListener('mousedown', ev => { if (ev.target.classList.contains('modal-back')) closeModal(); });
  $$('#modalRoot [data-dshift]').forEach(b => {
    b.onclick = () => {
      const s = state.shifts.find(x => x.id === Number(b.dataset.dshift));
      if (s) editShift(s);
    };
  });
  $('#modalRoot [data-dadd]').onclick = () => editShift(null, ds);
}

function editShift(shift, dateStr) {
  if (!state.workplaces.length) { alert('先に勤務先を追加してください。'); return; }
  formModal({
    title: shift ? 'シフトを編集' : 'シフトを追加',
    fields: [
      { key: 'workplaceId', label: '勤務先', type: 'select', required: true,
        value: shift ? shift.workplaceId : state.workplaces[0].id,
        options: state.workplaces.map(w => ({ value: w.id, label: w.name })) },
      { key: 'date',     label: '勤務日',   type: 'date', value: shift ? shift.date : dateStr, required: true },
      { key: 'start',    label: '開始時刻', type: 'time10', value: shift ? shift.start : '09:00' },
      { key: 'end',      label: '終了時刻', type: 'time10', value: shift ? shift.end : '17:00' },
      { key: 'breakMin', label: '休憩（分）', type: 'number', value: shift ? shift.breakMin : 0, min: 0, step: '5' },
      { key: 'status',   label: 'シフト区分', type: 'radio', value: shift ? shift.status : 'confirmed',
        options: [{ value: 'confirmed', label: '確定（塗りつぶし）' }, { value: 'tentative', label: '仮（外枠のみ）' }] }
    ],
    onSubmit: d => {
      d.workplaceId = Number(d.workplaceId);
      if (shift) Object.assign(shift, d);
      else state.shifts.push({ id: uid(), ...d });
      commit();
    },
    onDelete: shift ? () => { state.shifts = state.shifts.filter(s => s.id !== shift.id); commit(); } : null
  });
}

/* ============================================================
   7. 描画：共通パーツ
   ============================================================ */
function emptyBox(msg) { return '<div class="empty">' + esc(msg) + '</div>'; }

function donutSvg(items, centerLabel, centerValue) {
  const total = items.reduce((a, i) => a + i.value, 0);
  if (!total) return emptyBox('データがありません');
  const R = 62, C = 2 * Math.PI * R;
  let off = 0;
  const segs = items.map(i => {
    const len = C * (i.value / total);
    const s = '<circle cx="80" cy="80" r="' + R + '" fill="none" stroke="' + i.color +
      '" stroke-width="28" stroke-dasharray="' + len.toFixed(2) + ' ' + (C - len).toFixed(2) +
      '" stroke-dashoffset="' + (-off).toFixed(2) + '" transform="rotate(-90 80 80)"></circle>';
    off += len;
    return s;
  }).join('');
  return '<svg viewBox="0 0 160 160" width="180" height="180" role="img">' + segs +
    '<text x="80" y="74" text-anchor="middle" font-size="10" fill="#666">' + esc(centerLabel) + '</text>' +
    '<text x="80" y="93" text-anchor="middle" font-size="16" font-weight="700" fill="#000">' + esc(centerValue) + '</text></svg>';
}

function barList(items) {
  const total = items.reduce((a, i) => a + i.value, 0);
  if (!total) return emptyBox('データがありません');
  return items.map(i =>
    '<div class="barrow"><div class="barhead"><span><span class="color-bar" style="background:' + i.color + '"></span>' +
    esc(i.label) + '</span><span><strong>' + yen(i.value) + '</strong> <span class="muted">' +
    Math.round(i.value / total * 100) + '%</span></span></div>' +
    '<div class="bartrack"><div class="barfill" style="width:' + (i.value / total * 100) + '%;background:' + i.color + '"></div></div></div>'
  ).join('');
}

/** 'YYYY-MM' の1ヶ月前 */
function prevMonthOf(month) {
  const [y, m] = month.split('-').map(Number);
  return ym(new Date(y, m - 2, 1));
}
/** 'YYYY-MM' → 'YYYY年M月' */
function monthLabelOf(month) {
  const [y, m] = month.split('-');
  return y + '年' + Number(m) + '月';
}

  const budgetCard =
